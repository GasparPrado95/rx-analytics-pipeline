# Publish dbt docs to GitHub Pages on every merge to main.
# `dbt docs generate --static` produces one self-contained HTML file (manifest + catalog embedded).
# The catalog is read from the prod datasets (metadata only; nothing is built here).

name: dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BIGQUERY_LOCATION: EU
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt-ci
    defaults:
      run:
        working-directory: dbt_rx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dbt
        run: pip install -r ../requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: dbt profile
        run: mkdir -p "$DBT_PROFILES_DIR" && cp profiles.yml.example "$DBT_PROFILES_DIR/profiles.yml"

      - name: Generate docs
        run: |
          dbt deps
          dbt docs generate --target prod --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
